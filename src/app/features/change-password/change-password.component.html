<div class="mx-auto max-w-7xl px-3 py-3.5">
    <main class="min-w-0">
        <div class="mx-auto max-w-2xl">
            <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
                <div class="mb-5 flex items-center gap-3"><span
                        class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-[#e7f3ff] text-[#1877f2]"><svg
                            xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-key-round" aria-hidden="true">
                            <path
                                d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z">
                            </path>
                            <circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle>
                        </svg></span>
                    <div>
                        <h1 class="text-xl font-extrabold text-slate-900 sm:text-2xl">Change Password</h1>
                        <p class="text-sm text-slate-500">Keep your account secure by using a strong password.</p>
                    </div>
                </div>
                <form novalidate="" class="space-y-4" [formGroup]="changePasswordForm"
                    (ngSubmit)="submitChangePasswordForm()">
                    <!-- --------- password------ -->
                    <div>
                        @let oldPassword = changePasswordForm.get('password');
                        <label class="block">
                            <span class="mb-1.5 block text-sm font-bold text-slate-700">Current password</span>
                            <input #passInput placeholder="Enter current password" formControlName="password" [class]=" oldPassword?.invalid && oldPassword?.touched ?
                                'border-rose-600'  : ' border-slate-200' "
                                class="w-full relative rounded-xl border bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition "
                                type="password" value="" name="currentPassword">

                            <span (click)="showPassword(passInput)" class="absolute  eye-icon cursor-pointer">
                                <i [class]=" {
                                        'fa-eye-slash': passInput.type === 'password' , 
                                         'fa-eye': passInput.type === 'text'
                                    }     " class="fa-solid " style="color: rgb(74, 73, 73);"></i>
                            </span>

                            <!-- alert ------------------------- -->
                            @if (oldPassword?.invalid && oldPassword?.touched) {

                            @if (oldPassword?.hasError('required')) {
                            <span class="mt-1 block text-xs font-semibold text-rose-600 ">Current
                                password is
                                required.</span>
                            }

                            }
                        </label>
                    </div>

                    <!-- ------------------------- new password--------- -->
                    <div>
                        @let newPassword =changePasswordForm.get('newPassword');
                        <label class="block">
                            <span class="mb-1.5 block text-sm font-bold text-slate-700">New password</span>
                            <input #newpassInput placeholder="Enter new password" formControlName="newPassword" [class]=" newPassword?.invalid && newPassword?.touched ?
                                'border-rose-600'  : ' border-slate-200' "
                                class="w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition "
                                type="password" value="" name="newPassword" aria-autocomplete="list">

                            <span (click)="showNewPassword(newpassInput)" class="absolute  eye-icon cursor-pointer">
                                <i [class]=" {
                                        'fa-eye-slash': newpassInput.type === 'password' , 
                                         'fa-eye': newpassInput.type === 'text'
                                    }     " class="fa-solid " style="color: rgb(74, 73, 73);"></i>
                            </span>

                            @if (newPassword?.invalid && newPassword?.touched) {
                            @if (newPassword?.hasError('required')) {
                            <span class="mt-1 block text-xs font-semibold text-rose-600">New password is
                                required.</span>
                            } @else if (newPassword?.hasError('pattern')) {
                            <span class="mt-1 block text-xs font-semibold text-rose-600">
                                At least 8 characters with uppercase, lowercase, number, and special character.
                            </span>
                            }
                            }
                        </label>
                    </div>



                    <!------------------------------ Confirm password ------------ -->
                    <div>
                        @let confirmPassword = changePasswordForm.get('confirmPasswordInput');

                        <label class="block"><span class="mb-1.5 block text-sm font-bold text-slate-700">Confirm new
                                password</span>
                            <input #confipassInput placeholder="Re-enter new password"
                                formControlName="confirmPasswordInput" [class]=" confirmPassword?.invalid && confirmPassword?.touched ?
                                'border-rose-600'  : ' border-slate-200' "
                                class="w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition "
                                type="password" value="" name="confirmPassword">

                            <span (click)="showConfirmPassword(confipassInput)"
                                class="absolute  eye-icon cursor-pointer">
                                <i [class]=" {
                                        'fa-eye-slash': confipassInput.type === 'password' , 
                                         'fa-eye': confipassInput.type === 'text'
                                    }     " class="fa-solid " style="color: rgb(74, 73, 73);"></i>
                            </span>

                            @if (confirmPassword?.invalid && confirmPassword?.touched) {
                            @if (confirmPassword?.hasError('required')) {
                            <span class="mt-1 block text-xs font-semibold text-rose-600">Please confirm your new
                                password.</span>
                            }@else if (confirmPassword?.hasError('mismatch')) {
                            <span class="mt-1 block text-xs font-semibold text-rose-600">Passwords do not match..</span>
                            }
                            }
                        </label>
                    </div>

                    <button type="submit" (ngsubmit)="submitChangePasswordForm()"
                        class="inline-flex w-full items-center justify-center rounded-xl bg-[#1877f2] px-4 py-2.5 text-sm font-bold text-white transition hover:bg-[#166fe5] disabled:cursor-not-allowed disabled:opacity-60">Update
                        password
                        @if (loading) {
                        <i class="fa-solid fa-spinner animate-spin"></i>
                        }
                    </button>
                </form>
            </section>
        </div>
    </main>
</div>
